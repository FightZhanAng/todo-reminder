name: 出安装包

# 打 tag（v*）就构建 Windows 安装包并发一条 Release；也可以手动触发只构建不发版。
# 界面冒烟（pnpm smoke）要真开 Electron 窗口，CI 上没有桌面会话，所以这里不跑。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 发 Release 要写权限；不给这一段的话 GITHUB_TOKEN 是只读的，最后一步会 403。
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与本机同大版本：pnpm 11 起构建脚本白名单只认 pnpm-workspace.yaml 的 allowBuilds，
          # 留在 10 会让两边各读各的配置
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 验证
        run: pnpm typecheck && pnpm test:core
        shell: bash

      - name: 打包
        # DIST_OFFICIAL_MIRROR=1：CI 上直连 GitHub 是通的，不走 npmmirror（那是给本机用的）
        run: pnpm dist
        env:
          DIST_OFFICIAL_MIRROR: '1'
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # latest.yml 与 blockmap 不是给人双击的安装包，但**少了它们自动更新
          # 就完全不通**：客户端要先读 latest.yml 才知道有没有新版，读不到就是 404
          path: |
            release/todo-reminder-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" \
              --notes "Windows 安装包。setup 是 per-user NSIS 安装版，带自动更新；portable 双击即用但不能自动更新（它跑在临时解压目录里），新版本要自己下。"
          # latest.yml 是自动更新的版本指针，必须和 exe 属于同一次构建 ——
          # 拿旧的 yml 配新的 exe，客户端会按错误的 sha512 校验失败。
          # 注意 tag 必须和 package.json 的 version 一致，否则客户端算了半天
          # 也认不出有新版（两边版本号对不上）
          gh release upload "$tag" \
            release/todo-reminder-*.exe \
            release/latest.yml \
            release/*.blockmap \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash

appId: com.tomcato.todo-reminder
productName: 待办提醒
copyright: Copyright © 2026 tomcato

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

# 更新源。**必须显式写出来**：electron-builder 会按这段生成包内的
# `resources/app-update.yml`，运行时 electron-updater 只认那个文件 ——
# 而它是靠 git remote 推断的（推断出来的值恰好也对，但换个 fork、
# CI 里换成 https 形式的 remote、或者浅克隆，推出来的 owner/repo 就可能不是
# 这个仓库）。自动更新指向别人的仓库是那种「装上以后才发现」的问题。
publish:
  provider: github
  owner: FightZhanAng
  repo: todo-reminder

win:
  # 用自己生成的多尺寸 .ico，不要喂 png 让它去转 —— electron-builder 内置的
  # WASM 图标工具在内存受限环境下会直接把打包流程崩掉。ico 本身是代码画出来的
  # （shared/appIcon.ts + pnpm icons），提交进仓库，打包机不必先跑一遍 node。
  icon: resources/icon.ico
  # 可执行文件名保持 ASCII：产品名是中文，但中文 exe 名在部分工具链和快捷方式
  # 解析上会出问题。显示名交给 productName，通知里的署名交给 AUMID 的 DisplayName
  executableName: todo-reminder
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 开始菜单那条是 Windows 认这个 AUMID 的依据（通知归属要它），桌面这条是给人找得到的
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 待办提醒
  artifactName: todo-reminder-${version}-setup.${ext}

portable:
  artifactName: todo-reminder-${version}-portable.${ext}

# macOS。产物由 CI 的 mac job 打（release.yml），本机是 Windows 打不了。
mac:
  # 应用包图标。与 .ico 同源：pnpm icons 从 shared/appIcon.ts 一起生成
  # （ic07/ic08/ic09/ic10 四档 PNG 载荷，128/256/512/1024），提交进仓库，
  # 打包机不做任何图标转换。
  icon: resources/icon.icns
  # Agent 应用：Info.plist 里声明不走 Dock —— 和 main/index.ts 运行时的
  # app.dock.hide() 是同一件事的两层保险，区别是 plist 这层连启动瞬间
  # 的 Dock 闪烁都没有。
  extendInfo:
    LSUIElement: true
  # 两个架构都出：纯 JS 没有原生模块，arm64 机器上交叉编译 x64 没有额外成本。
  # zip 是给自动更新的（electron-updater 的 MacUpdater 只认 zip，dmg 只给人下载），
  # 哪天配了 Developer ID 证书，这条链路就直接能用，不用再改 target。
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # 产物名保持 ASCII（同 win.executableName 的理由）：productName 是中文，
  # 中文 dmg 文件名在浏览器下载与部分工具链上会出问题。${arch} 让两个
  # 架构的产物各自带后缀，latest-mac.yml 里按架构各记一条。
  artifactName: todo-reminder-${version}-${arch}.${ext}
